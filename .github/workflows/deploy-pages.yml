name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages (auto-enable, switch source to Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # يعمل هذا الخط الأنبوبي بأمان في الحالتين:
      # - قبل وجود React: package.json غير موجود → ينشر الملفات الثابتة كما هي (نفس السلوك الحالي)
      # - بعد إضافة React: يبني بـ Vite وينشر مجلد dist
      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build (React/Vite)
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build

      - name: Select publish directory
        id: publishdir
        run: |
          if [ -f package.json ]; then
            echo "dir=./dist" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.publishdir.outputs.dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
